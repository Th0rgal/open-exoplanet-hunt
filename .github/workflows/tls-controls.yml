name: Independent TLS detector controls
on:
  workflow_dispatch:
    inputs:
      comparison_run_id:
        description: Optional previous control artifact for exact independent replay
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: independent-tls-controls
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NUMBA_CPU_NAME: generic
      NPY_ENABLE_CPU_FEATURES: SSE3
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.cache/tls-jit
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: discovery/tls-requirements.txt
      - run: pip install --only-binary=batman-package,numba,llvmlite -r discovery/tls-requirements.txt
      - run: python -B scripts/verify_all.py
      - run: python -B -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: .cache/tls-jit
          key: tls-jit-generic-numpy-baseline-v1-${{ runner.os }}-py312-${{ hashFiles('discovery/tls-requirements.txt', 'discovery/controls/tls-v1.json') }}
      - uses: actions/download-artifact@v4
        if: inputs.comparison_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.comparison_run_id }}
          name: tls-controls-${{ inputs.comparison_run_id }}
          path: tls-comparison
      - run: python -B discovery/tls_controls.py
        if: inputs.comparison_run_id == ''
      - run: python -B discovery/tls_controls.py --compare tls-comparison/science.json
        if: inputs.comparison_run_id != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tls-controls-${{ github.run_id }}
          path: tls-output/
          retention-days: 30
