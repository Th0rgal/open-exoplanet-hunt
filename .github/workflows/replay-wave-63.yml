name: Replay negative 63-target TESS wave
on:
  push:
    branches:
      - 'scan/2026-11-03-wave-63-negative'
    paths:
      - 'registry/batches/2026-11-03-wave-63-negative/**'
      - '.github/workflows/replay-wave-63.yml'
  pull_request:
    paths:
      - 'registry/batches/2026-11-03-wave-63-negative/**'
      - '.github/workflows/replay-wave-63.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r registry/batches/2026-11-03-wave-63-negative/replay-requirements.txt
      - run: python -B scripts/verify_all.py
      - run: python -B -m unittest discover -s tests -v
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: registry/batches/2026-11-03-wave-63-negative/replay-requirements.txt
      - run: pip install -r registry/batches/2026-11-03-wave-63-negative/replay-requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tess-wave-fits
          key: tess-wave-63-${{ runner.os }}-${{ matrix.partition }}-${{ hashFiles('registry/batches/2026-11-03-wave-63-negative/manifest.json') }}
          restore-keys: |
            tess-wave-63-${{ runner.os }}-${{ matrix.partition }}-
      - name: Replay exact MAST products and aliases
        run: python -B registry/batches/2026-11-03-wave-63-negative/replay.py --partition "${{ matrix.partition }}"
        env:
          TESS_REPLAY_CACHE: ${{ runner.temp }}/tess-wave-fits
