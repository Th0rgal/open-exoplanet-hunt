name: Replay negative TESS batch
on:
  pull_request:
    paths:
      - 'registry/batches/2026-11-01-wave-60-negative/**'
      - '.github/workflows/replay-wave-60.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      TESS_REPLAY_CACHE: ${{ runner.temp }}/tess-wave-fits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: registry/batches/2026-11-01-wave-60-negative/replay-requirements.txt
      - run: pip install -r registry/batches/2026-11-01-wave-60-negative/replay-requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tess-wave-fits
          key: tess-wave-${{ runner.os }}-${{ matrix.partition }}-${{ hashFiles('registry/batches/2026-11-01-wave-60-negative/manifest.json') }}
          restore-keys: |
            tess-wave-${{ runner.os }}-${{ matrix.partition }}-
      - run: python -B registry/batches/2026-11-01-wave-60-negative/replay.py --partition "${{ matrix.partition }}"
